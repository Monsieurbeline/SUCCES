<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1b5e20">

<link rel="icon" href="icon-192.png"><title>Recrutement – SUCCES</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tinos:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{--g1:#1b5e20;--g2:#2d7d1f;--g3:#7dba48;--bg:#eef3ea;--ink:#1f3a14;--mut:#5f7355;--line:#d3dfca;--gold:#f0c919;--red:#b3261e;--card:#fff;--btxt:#1b5e20}
body.dark{--bg:#11160e;--ink:#e4eede;--mut:#9db291;--line:#2d3b27;--card:#1b2317;--btxt:#a9e08a}body.dark input,body.dark select{border-color:#44563b}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid #b9c9ae;border-radius:10px;background:var(--card);font-size:1rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--g2);color:#fff;font-size:.9rem;white-space:nowrap}
.btn.alt{background:var(--card);color:var(--btxt);border:1px solid var(--line)}.btn.del{background:var(--card);color:var(--red);border:1px solid #efc9c6}
.btn.sm{padding:7px 10px;font-size:.8rem}.btn:disabled{opacity:.6}
label{display:grid;gap:4px;font-size:.8rem;font-weight:600}
header{background:var(--g1);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:1rem;line-height:1.15}header h1 b{font-weight:800;display:block;font-size:1.15rem}
.hl{display:flex;align-items:center;gap:10px;min-width:0}.hr{display:flex;gap:8px}
.logoimg{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;flex:none}.bell{padding:7px 11px;font-size:1.1rem}
@media(max-width:479px){.hd{display:none}}
main{max-width:900px;margin:0 auto;padding:14px 12px 90px}
.tools{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px}.tools .s{grid-column:1/-1}
.stats{font-size:.8rem;color:var(--mut);margin-bottom:12px}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:56px 1fr;gap:10px 12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem;text-transform:uppercase}
.nm{font-weight:600;line-height:1.2}.nm small{display:block;font-weight:400;color:var(--mut);font-size:.8rem;margin-top:2px}
.dt{font-size:.8rem;color:var(--mut);margin-top:3px}
.badge{display:inline-block;background:var(--gold);color:#5a3a00;border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:600;margin-left:6px}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:14px 18px;border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(10,25,5,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:12px;max-height:100vh;overflow:auto}
.sheet{grid-auto-rows:max-content;align-content:start}.sheet h2{font-size:1.1rem}.g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}.sec h3{font-size:.85rem;color:var(--btxt)}.msgok{font-size:.8rem;color:var(--mut)}
.ck{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.88rem}.ck input{width:auto}.cks{display:flex;flex-wrap:wrap;gap:6px 14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:8px}legend{font-size:.78rem;font-weight:600;padding:0 4px}
.cpv{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);background:#e9ecf3}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}.item{grid-template-columns:56px 1fr auto}.acts{grid-column:auto}.tools{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:800px){.emb header{padding-left:58px}.emb .sheet{max-height:calc(100vh - 60px)}}label input,label select,label textarea{font-weight:400}
textarea{width:100%;padding:11px 12px;border:1px solid #b9c9ae;border-radius:10px;background:var(--card);font:inherit;font-size:.95rem;resize:vertical;font-weight:400}
@media(max-width:800px){.emb header{padding-left:58px}.emb .sheet{max-height:calc(100vh - 60px)}}label input,label select,label textarea{font-weight:400}
.pgw{position:relative;width:100%;aspect-ratio:1275/1650;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.25);margin-bottom:10px;background:#fff}
.pg{position:absolute;left:0;top:0;width:1275px;height:1650px;transform-origin:0 0;overflow:hidden;font-family:Tinos,'Times New Roman',serif;color:#111;background:#fff}
.pg .bg{position:absolute;left:0;top:0;width:1275px;height:1650px}
.pg .ad{position:absolute;left:868px;top:206px;white-space:nowrap;font:600 22px/27px 'Cormorant Garamond',Georgia,serif;font-variant-numeric:oldstyle-nums;color:#3a4f36}
.pc,#meas{display:flex;flex-direction:column;width:980px}.pc{position:absolute;left:148px}
#meas{position:absolute;left:-99999px;top:0;visibility:hidden;font-family:Tinos,'Times New Roman',serif;color:#111}
.blk{margin-bottom:10px;font-size:25px;line-height:31px}.blk.tight{margin-bottom:4px}.blk.gap{margin-bottom:24px}.blk.hd{margin-top:22px}
.rdate{text-align:right;font-weight:700;font-size:27px}
.rtitle{text-align:center;font-weight:700;font-size:31px;line-height:40px;margin:70px 0 26px}
.blk p{margin:0;text-align:justify}
.rt{width:100%;border-collapse:collapse;border:2px solid #111}.rt td{padding:3px 8px;vertical-align:top;font-size:25px;line-height:31px}.rt td:first-child{width:37%}.rt tr:first-child td{font-weight:700}
.rh{font-weight:700;text-decoration:underline;font-size:28px}
.li{display:flex;gap:16px;text-align:justify;padding-left:22px}.li i{font-style:normal;flex:none}
.blk .ps{font-weight:700;font-style:italic;line-height:46px;margin-top:14px}
.sigb{margin-left:auto;width:460px;text-align:center;margin-top:64px;position:relative}.sigb img{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% - 4px);max-height:110px;max-width:360px}.sigb .sl{border-top:2px solid #111}.sigb b{font-style:italic;display:block;margin-top:4px}
</style></head><body><header><div class="hl"><img class="logoimg" src="icon-192.png" alt="Logo"><h1><span class="hd">Caisse Populaire </span><b>SUCCES</b></h1></div><div class="hr"><button class="btn alt bell" id="gear" aria-label="Réglages">⚙️</button></div></header><main>
  <div class="tools"><input class="s" id="q" type="search" placeholder="Rechercher un poste, un lieu…" aria-label="Rechercher">
    <select id="ft" aria-label="Type"><option value="">Tous les types</option><option value="ve">Poste vacant externe</option><option value="vi">Poste vacant interne</option><option value="re">Recrutement externe</option><option value="ri">Recrutement interne</option></select>
    <select id="fs" aria-label="Trier"><option value="r">Plus récents</option><option value="n">Intitulé A–Z</option></select></div>
  <div class="stats" id="rc"></div><div class="list" id="rl"></div>
</main>
<button class="btn fab" id="add">+ Nouveau</button>
<div id="meas"></div>
<div class="modal" id="mform" hidden><form class="sheet" id="f" onsubmit="return false" autocomplete="off">
  <h2 id="ftitle">Nouvel avis</h2>
  <div class="stats" id="np"></div><div id="pvs"></div>
  <label>Type d’avis<select id="type"><option value="ve">Avis de poste vacant Externe</option><option value="vi">Avis de poste vacant Interne</option><option value="re">Avis de recrutement Externe</option><option value="ri">Avis de recrutement Interne</option></select></label>
  <label>Intitulé du poste<input id="titre" placeholder="Secrétaire-Réceptionniste"></label>
  <div class="g2"><label>Lieu<select id="lsel"><option value="sg">Siège social</option><option value="bd">Comptoir de Beaudouin</option><option value="dk">Comptoir de Dekouze</option><option value="ps">Autre point de service…</option></select></label>
  <label id="lw" hidden>Nom du point de service<input id="lnom"></label></div>
  <label>Lieu d’affectation (adresse)<input id="adr" placeholder="A l’entrée du Marché de Beaudouin, Jacmel-Haïti"></label>
  <div class="g2"><label>Durée du contrat<input id="duree"></label><label>Nombre de postes<input id="nb" type="number" min="1"></label></div>
  <div class="g2"><label>Date de publication<input id="dpub" type="date"></label><label>Date limite des dossiers<input id="dlim" type="date"></label></div>
  <div class="g2"><label>Ville<input id="ville"></label><label>Date du document<input id="dt" type="date"></label></div>
  <label>Introduction<textarea id="intro" rows="3"></textarea></label>
  <label>Présentation de la Caisse (**gras**)<textarea id="pres" rows="5"></textarea></label>
  <label>Responsabilités générales<textarea id="resp" rows="7"></textarea></label>
  <label>Fonctions spécifiques (une puce par ligne)<textarea id="fonc" rows="8"></textarea></label>
  <label>Compétences et attitudes requises (une puce par ligne)<textarea id="comp" rows="8"></textarea></label>
  <label>Pièces requises (une puce par ligne)<textarea id="pieces" rows="5"></textarea></label>
  <label>P.S.<textarea id="psx" rows="3"></textarea></label>
  <div class="bar"><button type="button" class="btn alt" data-close>Annuler</button><button type="button" class="btn alt" id="bpdf">Télécharger le PDF</button><button type="button" class="btn" id="okb">Enregistrer</button></div>
</form></div>
<div class="modal" id="md" hidden><div class="sheet" style="max-width:760px"><div id="mpv"></div>
  <div class="bar"><button class="btn alt" id="mx">Fermer</button><button class="btn alt" id="medit">Modifier</button><button class="btn" id="mpdf">Télécharger le PDF</button></div></div></div>
<div class="modal" id="mset" hidden><div class="sheet"><h2>⚙️ Réglages</h2>
  <div class="sec"><h3>Signature</h3><label>Libellé sous la signature<input id="sl"></label>
  <div class="g2"><label>Image de signature<input id="sf" type="file" accept="image/*"></label><button type="button" class="btn alt sm" id="sc">Retirer</button></div></div>
  <div class="sec"><h3>Sauvegarde</h3><div class="g2"><button class="btn alt" id="bbk">Sauvegarder (JSON)</button><label class="btn alt" style="text-align:center">Restaurer<input id="brf" type="file" accept=".json" hidden></label></div>
  <div class="msgok">Les avis sont enregistrés dans ce navigateur (et synchronisés avec Google si la synchronisation est configurée).</div></div>
  <div class="bar"><button class="btn" data-close>Fermer</button></div></div></div>

const DEF={type:'ve',titre:'Secrétaire-Réceptionniste',lsel:'bd',lnom:'',adr:'A l’entrée du Marché de Beaudouin, Jacmel-Haïti',duree:'Indéterminée (CDI)',nb:'1',ville:'Jacmel',
intro:'La Caisse Populaire SUCCES cherche à combler le poste ci-dessous dans le cadre de ses activités opérationnelles :',
pres:'La **S**ociété d’**U**tilisation **C**oopérative du **C**rédit et de l’**E**pargne pour l’Epanouissement **S**ocio-économique (**SUCCES**), une Caisse qui est fondée le 14 Juin 2001 et offre des services d’Epargne et de Crédit à la Communauté du Sud-Est, également membre du réseau FECAPH / LE LEVIER et de l’ANACAPH.',
resp:'Sous l’autorité immédiate du Responsable de Comptoir, le / la Secrétaire est responsable de la préparation et de la correction des documents, de la gestion des certificats de DAT, du traitement et du classement des informations reçues, de l\'ensemble des activités relatives à l\'adhésion du membre, et en collaboration avec le Responsable, d\'améliorer les relations avec les membres de la Caisse. De plus, il/elle est le lien entre le Responsable et les autres membres du personnel de la Caisse. Il/Elle a aussi pour responsabilité de fournir toutes les informations relatives à l\'adhésion à la Caisse ainsi qu\'aux produits et services que la Caisse peut offrir à ses membres, de diriger les appels reçus pour les diverses ressources de la coopérative. Il/elle a également pour mission de remplir les tâches spécifiques suivantes :',
fonc:['Assurer de façon permanente, la promotion des services offerts par la Caisse, expliquer le but de la Caisse, les services qui y sont offerts et les avantages d\'y adhérer en tant que membre ;','Expliquer aux gens les statuts, les règlements et les politiques (notamment la politique de crédit) régissant la Caisse ;','Veiller à la qualité des services, l\'accueil des personnes et à la promotion des produits de la Caisse ;','Gérer et intégrer l\'adhésion et la démission des membres ;','Effectuer la mise à jour des informations personnelles des membres ;','Gérer le personnel de soutien de la Caisse ;','Tenir à jour les registres administratifs de la Caisse ;','Collaborer avec les différentes sections de la Caisse en cas de besoin ;','Servir d\'intermédiaire entre la Direction du Comptoir et les autres membres du personnel ;','Remplir toutes autres fonctions à la demande du Responsable ;','Orienter les membres et les non-membres vers les différentes sections de la Caisse ;','Répondre avec courtoisie aux appels téléphoniques et les acheminer à qui de droit ;','Fournir tous les renseignements aux membres et aux non-membres sur le fonctionnement général de la Caisse ;','Faire le classement correct de tous documents dans les classeurs prévus à cette fin ;','Recevoir les inscriptions des nouveaux membres de la Caisse ;','Mettre à jour quotidiennement le registre des membres de la Caisse ;','Soumettre au Responsable les fiches d\'admission et de testament des nouveaux membres chaque fin du mois ;','Effectuer toutes autres tâches connexes assignées par le Responsable de Comptoir.'].join('\n'),
comp:['Détenteur d’une Licence en Comptabilité, Finance, Économie ou Gestion;','Avoir des expériences professionnelles pertinentes en Secrétariat et en Service à la clientèle (un atout);','Avoir une excellente capacité rédactionnelle et communicationnelle;','Capacité de nouer une relation de confiances avec ses membres;','Capacité relationnelle et de négociation;','Rigueur et autonomie;','Sens de la qualité du service aux sociétaires;','Faire preuve de rigueur et de précision dans l’exécution du travail;','Préserver la confidentialité et l’intégrité de l’ensemble des informations et données dont il/elle a la charge et/ou la connaissance;','Être disponible et accessible pour les utilisateurs du système et les membres;','Adhérer aux valeurs de l’organisation;','Avoir une moralité au-dessus de tout soupçon;','Maitriser les logiciels de base en informatiques;','Être très discret et avoir un casier judiciaire vierge;','Être disponible et accessible pour le personnel et inspirer confiance;','Avoir le sens de responsabilité et adhésion aux valeurs de l’organisation;','Avoir le sens de la courtoisie et l’esprit d’équipe;','Et enfin, être capable de travailler seul (e), ou en équipe sous la supervision de quelqu’un, et respecter les délais.'].join('\n'),

psx:'P.S : Les dossiers peuvent être déposés dans les trois (3) points de Service de la Caisse et prière de remplir un formulaire de demande d’emploi. Seuls les candidats présélectionnés subiront un examen écrit.'};
const FIELDS=['type','titre','lsel','lnom','adr','duree','nb','dpub','dlim','ville','dt','intro','pres','resp','fonc','comp','pieces','psx'];
let list=ST.get('rc_list',[]),cur=null,SHOWN=[],VW=null,SET=Object.assign({sl:'Service des Ressources Humaines',si:''},ST.get('rc_set',{}));
const val=()=>{const v={};FIELDS.forEach(k=>v[k]=$(k).value.trim());return v};
const lines=s=>String(s).split(/\n/).map(x=>x.trim()).filter(Boolean);
const wrap=b=>`<div class="blk ${b.cls||''}">${b.h}</div>`;

function blocks(v){
  const L=LIEUX[v.lsel]||v.lnom||'…',B=[],add=(h,o)=>B.push(Object.assign({h},o||{}));
  add(`<div class="rdate">${esc(v.ville)}, le ${fdw(v.dt)}</div>`);
  add(`<div class="rtitle"><u>${esc(TYPES[v.type])} / ${esc(v.titre||'…')}</u></div>`,{keep:1});
  add(`<p>${fmt(v.intro)}</p>`,{cls:'gap'});
  const rows=[['Poste',(v.titre||'…')+' au '+L],['Lieu d’affectation',v.adr||'…'],['Durée du Contrat',v.duree||'…'],['Nombre de postes à pourvoir',v.nb||'…'],['Date de publication de poste',fdw(v.dpub,1)],['Date limite de réception de dossier',fdw(v.dlim,1)]];
  add('<table class="rt">'+rows.map(r=>`<tr><td>${esc(r[0])}</td><td>: ${esc(r[1])}</td></tr>`).join('')+'</table>',{cls:'gap'});
  add(`<p>${fmt(v.pres)}</p>`);
  add('<div class="rh">Responsabilités Générales</div>',{keep:1,cls:'hd'}); add(`<p>${fmt(v.resp)}</p>`);
  [['Fonctions spécifiques',v.fonc],['Compétences et attitudes requises',v.comp],['Pièces Requises',v.pieces]].forEach(([t,x])=>{
    const a=lines(x);if(!a.length)return;add(`<div class="rh">${t}</div>`,{keep:1,cls:'hd'});a.forEach(i=>add(`<div class="li"><i>●</i><span>${fmt(i)}</span></div>`,{cls:'tight'}));
  });
  if(v.psx)add(`<p class="ps">${fmt(v.psx)}</p>`);
  B[B.length-1].keep=1;
  add(`<div class="sigb">${SET.si?`<img src="${SET.si}" alt="">`:''}<div class="sl"></div><b>${esc(SET.sl||'')}</b></div>`);
  return B;
}
function layout(v){
  const B=blocks(v),m=$('meas');m.innerHTML=B.map(wrap).join('');
  [...m.children].forEach((el,i)=>{const cs=getComputedStyle(el);B[i].t=el.offsetHeight+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom)});
  const P=[[]];let y=392;const LIM=1560;
  B.forEach((b,i)=>{let need=b.t;if(b.keep&&B[i+1])need+=B[i+1].t;
    if(y+need>LIM&&P[P.length-1].length){P.push([]);y=120}
    P[P.length-1].push(b);y+=b.t});
  return P;
}
const pagesHTML=P=>P.map((bl,i)=>`<div class="pgw"><div class="pg"><img class="bg" src="${i?BG2:BG1}" alt="">${i?'':ADDR}<div class="pc" style="top:${i?120:392}px">${bl.map(wrap).join('')}</div></div></div>`).join('');
const fitAll=r=>r.querySelectorAll('.pgw').forEach(w=>{w.firstElementChild.style.transform='scale('+(w.clientWidth/1275)+')'});
function paint(v,root){const P=layout(v);root.innerHTML=pagesHTML(P);fitAll(root);return P.length}
let tmr;const refresh=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{$('np').textContent='Aperçu : '+paint(val(),$('pvs'))+' page(s)'},250)};

async function toPdf(v,name,btn){
  const t=btn.textContent;btn.disabled=true;btn.textContent='Génération…';
  const tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-99999px;top:0;width:1275px';
  try{
    try{await document.fonts.ready}catch(e){}
    tmp.innerHTML=pagesHTML(layout(v));document.body.appendChild(tmp);
    const pdf=new jspdf.jsPDF({unit:'mm',format:'letter'}),pgs=tmp.querySelectorAll('.pg');
    for(let i=0;i<pgs.length;i++){const c=await html2canvas(pgs[i],{scale:1,backgroundColor:'#fff'});if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,215.9,279.4)}
    pdf.save(name+'.pdf');
  }catch(e){alert('Génération impossible : connexion internet requise la première fois.')}
  tmp.remove();btn.disabled=false;btn.textContent=t;
}
const fn=v=>('Avis-'+v.type+'-'+v.titre).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_');
const syncL=()=>{$('lw').hidden=$('lsel').value!=='ps'};
function openF(e){
  cur=e?e.id:null;const t=new Date(),w=new Date(Date.now()+7*864e5);
  const v=e||Object.assign({},DEF,{dpub:iso(t),dlim:iso(w),dt:iso(t)});
  FIELDS.forEach(k=>$(k).value=v[k]??'');syncL();
  $('ftitle').textContent=e?'Modifier l’avis':'Nouvel avis';$('mform').hidden=false;refresh();
}
function save(){
  const v=val();if(!v.titre){alert('L’intitulé du poste est obligatoire.');return null}
  let e=list.find(x=>x.id===cur);if(!e){e={id:Date.now().toString(36)};list.push(e);cur=e.id}
  Object.assign(e,v);ST.set('rc_list',list);draw();return e;
}
function draw(){
  const q=strip($('q').value),t=$('ft').value;
  const l=list.filter(e=>(!t||e.type===t)&&strip(e.titre+' '+e.lsel+' '+e.lnom+' '+(LIEUX[e.lsel]||'')).includes(q));
  l.sort($('fs').value==='n'?(a,b)=>strip(a.titre).localeCompare(strip(b.titre)):(a,b)=>(b.dt||'').localeCompare(a.dt||'')||b.id.localeCompare(a.id));
  SHOWN=l;$('rc').textContent=l.length+' sur '+list.length+' avis';
  $('rl').innerHTML=l.length?l.map(e=>`<div class="item"><div class="av">💼</div><div><div class="nm">${esc(e.titre)}<span class="badge">${esc(TYPES[e.type].replace('Avis de ',''))}</span><small>${esc(LIEUX[e.lsel]||e.lnom)}</small></div><div class="dt">Publié le ${fdw(e.dpub)} · limite ${fdw(e.dlim)}</div></div><div class="acts"><button class="btn sm" data-v="${e.id}">Voir</button><button class="btn alt sm" data-o="${e.id}">Modifier</button><button class="btn alt sm" data-c="${e.id}">Dupliquer</button><button class="btn del sm" data-d="${e.id}">Supprimer</button></div></div>`).join('')
    :'<div class="empty">Aucun avis.<br>Appuyez sur « + Nouveau » : le modèle « Secrétaire-Réceptionniste » est prêt à modifier.</div>';
}
$('add').onclick=()=>openF(null);
$('okb').onclick=()=>{if(save())$('mform').hidden=true};
$('bpdf').onclick=()=>{const v=val();if(!v.titre)return alert('Renseignez l’intitulé du poste.');toPdf(v,fn(v),$('bpdf'))};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.modal').hidden=true});
$('f').oninput=$('f').onchange=()=>{syncL();refresh()};['q','ft','fs'].forEach(k=>$(k).oninput=draw);
$('rl').onclick=ev=>{
  const b=ev.target.closest('button');if(!b)return;const e=list.find(x=>x.id===(b.dataset.v||b.dataset.o||b.dataset.c||b.dataset.d));if(!e)return;
  if(b.dataset.v){VW=e;$('md').hidden=false;paint(e,$('mpv'))}
  else if(b.dataset.o)openF(e);
  else if(b.dataset.c){list.push(Object.assign({},e,{id:Date.now().toString(36),titre:e.titre+' (copie)',dt:iso(new Date())}));ST.set('rc_list',list);draw()}
  else if(confirm('Supprimer « '+e.titre+' » ?')){list=list.filter(x=>x.id!==e.id);if(cur===e.id)cur=null;ST.set('rc_list',list);draw()}
};
$('mx').onclick=()=>{$('md').hidden=true};$('medit').onclick=()=>{$('md').hidden=true;openF(VW)};
$('mpdf').onclick=()=>toPdf(VW,fn(VW),$('mpdf'));
$('gear').onclick=()=>{$('sl').value=SET.sl;$('mset').hidden=false};
$('sl').oninput=()=>{SET.sl=$('sl').value;ST.set('rc_set',SET)};
$('sf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,500/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);SET.si=c.toDataURL('image/png');ST.set('rc_set',SET)};i.src=r.result};r.readAsDataURL(f)};
$('sc').onclick=()=>{SET.si='';ST.set('rc_set',SET)};
$('bbk').onclick=()=>dl(new Blob([JSON.stringify({v:1,list,SET})],{type:'application/json'}),'sauvegarde-recrutement-'+iso(new Date())+'.json');
$('brf').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.list))throw 0;if(!confirm('Remplacer les avis actuels par la sauvegarde ('+j.list.length+') ?'))return;list=j.list;SET=Object.assign(SET,j.SET||{});ST.set('rc_list',list);ST.set('rc_set',SET);draw()}catch(e){alert('Fichier invalide.')}ev.target.value=''};
new ResizeObserver(()=>{fitAll($('pvs'));fitAll($('mpv'))}).observe(document.body);
try{document.fonts.ready.then(()=>{if(!$('mform').hidden)refresh()})}catch(e){}
try{document.body.classList.toggle('dark',localStorage.getItem('succes_dark')==='1')}catch(e){}
draw();
</script></body></html>
