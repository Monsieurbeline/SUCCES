<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SUCCES">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Outils – Caisse Populaire SUCCES</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%}body{font-family:Poppins,system-ui,sans-serif;background:#eef3ea;color:#1f3a14}
:focus-visible{outline:3px solid #f0c919;outline-offset:2px}
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(170deg,#93d765,#58953a 60%,#3f7a2b)}
.lbox{background:#fff;border-radius:18px;padding:26px 22px;width:min(380px,100%);display:grid;gap:12px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.lbox img{width:84px;height:84px;margin:0 auto;border-radius:50%}.lbox{gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.2)}.lbox h1{font-size:1.25rem;line-height:1.2}.lbox h1 b{color:#0a7a1e;font-weight:800;display:block;font-size:1.7rem}.lbox p{font-size:.85rem;color:#5f7355}
label{display:grid;gap:4px;font-size:.8rem;font-weight:600;text-align:left}
input{width:100%;padding:11px 12px;border:1px solid #b9c9ae;border-radius:10px;font:inherit;font-size:1rem}
.go{border:0;border-radius:10px;padding:12px;background:#2d7d1f;color:#fff;font:600 1rem Poppins,sans-serif;cursor:pointer}
#le{color:#b3261e;font-size:.85rem;min-height:1.1em}
#app{display:grid;grid-template-columns:250px 1fr;height:100vh;height:100dvh}
aside{background:linear-gradient(180deg,#1b5e20,#14440f);color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:6px;padding-top:max(16px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:8px}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff}.brand b{display:block;font-size:1rem}.brand span{font-size:.75rem;opacity:.8}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:0;border-radius:10px;background:transparent;color:#fff;font:500 .95rem Poppins,sans-serif;cursor:pointer;text-align:left}
.nav:hover{background:rgba(255,255,255,.1)}.nav.on{background:#f0c919;color:#4a3200;font-weight:600}.nav i{font-style:normal;font-size:1.2rem}
.sp{flex:1}.out{border:1px solid rgba(255,255,255,.35)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.fmn{display:none}.top{display:none;align-items:center;gap:10px;background:#1b5e20;color:#fff;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.top button{border:0;background:transparent;color:#fff;font-size:1.5rem;cursor:pointer;padding:2px 8px}.top img{width:30px;height:30px;border-radius:50%;background:#fff;margin-left:auto}.top b{font-size:.95rem}
iframe{border:0;width:100%;flex:1;min-height:0;background:#eef3ea}
.scrim{display:none}
@media(max-width:800px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none}.scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
 .fmn{display:block;position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 15px);z-index:12;width:40px;height:40px;border:0;border-radius:10px;background:#fff;color:#1b5e20;font-size:1.4rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<section id="login">
  <form class="lbox" id="lf">
    <img src="icon-192.png" alt="Logo Caisse Populaire SUCCES">
    <h1>Caisse Populaire <b>SUCCES</b></h1><p>Anniversaires, certificats, communiqués et simulateurs</p>
    <label>Utilisateur<input id="lu" autocomplete="username" required></label>
    <label>Mot de passe<input id="lp" type="password" autocomplete="current-password" required></label>
    <div id="le" role="alert"></div>
    <button class="go">Se connecter</button>
  </form>
</section>
<div id="app" hidden>
  <aside id="sb">
    <div class="brand"><img src="icon-192.png" alt=""><div><b>SUCCES</b><span>Outils internes</span></div></div>
    <nav id="nv" style="display:grid;gap:6px"></nav>
    <div class="sp"></div>
    <button class="nav out" id="lo"><i>⎋</i>Se déconnecter</button>
  </aside>
  <div class="scrim" id="sc"></div>
  <main>
    <button id="mn" class="fmn" aria-label="Menu">☰</button><span id="tt" hidden></span>
    <div id="fr" style="display:flex;flex:1;min-height:0;flex-direction:column"></div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const USER = 'admin', PASS = 'succes2026';   // mêmes identifiants pour tous les outils : à changer ici
const TOOLS = [
  {id: 'anniversaires', label: 'Anniversaires', ico: '🎂', src: 'anniversaires.html'},
  {id: 'certificats', label: 'Certificats de stage', ico: '📜', src: 'certificats.html'},
  {id: 'communiques', label: 'Communiqués', ico: '📢', src: 'communiques.html'},
  {id: 'simulateurs', label: 'Simulateurs', ico: '🧮', src: 'simulateurs.html'},
  {id: 'verification', label: 'Vérifier un certificat', ico: '🔍', src: 'verification.html'},
  {id: 'synchro', label: 'Synchronisation', ico: '🔄', src: 'sync.html'}
];
$('nv').innerHTML = TOOLS.map(t => `<button class="nav" data-t="${t.id}"><i>${t.ico}</i>${t.label}</button>`).join('');
function go(id) {
  const t = TOOLS.find(x => x.id === id) || TOOLS[0];
  if (!$('f-' + t.id)) { const f = document.createElement('iframe'); f.id = 'f-' + t.id; f.src = t.src; f.title = t.label; $('fr').appendChild(f); }
  TOOLS.forEach(x => { const f = $('f-' + x.id); if (f) f.hidden = x.id !== t.id; });
  document.querySelectorAll('.nav[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t.id));
  $('tt').textContent = t.label; document.title = t.label + ' – SUCCES';
  $('sb').classList.remove('open'); $('sc').classList.remove('open');
  try { history.replaceState(null, '', '#' + t.id); } catch (e) {}
}
window.reloadTools = () => TOOLS.forEach(t => { const f = $('f-' + t.id); if (f && t.id !== 'synchro') try { f.contentWindow.location.reload(); } catch (e) {} });
function start() {
  $('login').hidden = true; $('app').hidden = false; go(location.hash.slice(1));
  try { if (localStorage.getItem('succes_sync')) { const a = document.createElement('iframe'); a.src = 'sync.html#auto'; a.style.display = 'none'; a.title = 'synchro'; document.body.appendChild(a); } } catch (e) {}
}
window.doLogout = () => { try { sessionStorage.removeItem('succes_ok'); } catch (e) {} location.replace(location.pathname); };
$('lf').onsubmit = e => {
  e.preventDefault();
  if ($('lu').value.trim() === USER && $('lp').value === PASS) { try { sessionStorage.setItem('succes_ok', '1'); } catch (x) {} start(); }
  else $('le').textContent = 'Identifiant ou mot de passe incorrect.';
};
$('nv').onclick = e => { const b = e.target.closest('[data-t]'); if (b) go(b.dataset.t); };
$('lo').onclick = window.doLogout;
$('mn').onclick = () => { $('sb').classList.add('open'); $('sc').classList.add('open'); };
$('sc').onclick = () => { $('sb').classList.remove('open'); $('sc').classList.remove('open'); };
try { if (sessionStorage.getItem('succes_ok')) start(); } catch (e) {}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
