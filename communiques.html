<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1b5e20">

<link rel="icon" href="icon-192.png"><title>Communiqués – SUCCES</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Bebas+Neue&display=swap">
<style>
:root{--g1:#1b5e20;--g2:#2d7d1f;--g3:#7dba48;--bg:#eef3ea;--ink:#1f3a14;--mut:#5f7355;--line:#d3dfca;--gold:#f0c919;--red:#b3261e;--card:#fff;--btxt:#1b5e20}
body.dark{--bg:#11160e;--ink:#e4eede;--mut:#9db291;--line:#2d3b27;--card:#1b2317;--btxt:#a9e08a}body.dark input,body.dark select{border-color:#44563b}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid #b9c9ae;border-radius:10px;background:var(--card);font-size:1rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--g2);color:#fff;font-size:.9rem;white-space:nowrap}
.btn.alt{background:var(--card);color:var(--btxt);border:1px solid var(--line)}.btn.del{background:var(--card);color:var(--red);border:1px solid #efc9c6}
.btn.sm{padding:7px 10px;font-size:.8rem}.btn:disabled{opacity:.6}
label{display:grid;gap:4px;font-size:.8rem;font-weight:600}
header{background:var(--g1);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:1rem;line-height:1.15}header h1 b{font-weight:800;display:block;font-size:1.15rem}
.hl{display:flex;align-items:center;gap:10px;min-width:0}.hr{display:flex;gap:8px}
.logoimg{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;flex:none}.bell{padding:7px 11px;font-size:1.1rem}
@media(max-width:479px){.hd{display:none}}
main{max-width:900px;margin:0 auto;padding:14px 12px 90px}
.tools{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px}.tools .s{grid-column:1/-1}
.stats{font-size:.8rem;color:var(--mut);margin-bottom:12px}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:56px 1fr;gap:10px 12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem;text-transform:uppercase}
.nm{font-weight:600;line-height:1.2}.nm small{display:block;font-weight:400;color:var(--mut);font-size:.8rem;margin-top:2px}
.dt{font-size:.8rem;color:var(--mut);margin-top:3px}
.badge{display:inline-block;background:var(--gold);color:#5a3a00;border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:600;margin-left:6px}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:14px 18px;border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(10,25,5,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:12px;max-height:100vh;overflow:auto}
.sheet{grid-auto-rows:max-content;align-content:start}.sheet h2{font-size:1.1rem}.g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}.sec h3{font-size:.85rem;color:var(--btxt)}.msgok{font-size:.8rem;color:var(--mut)}
.ck{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.88rem}.ck input{width:auto}.cks{display:flex;flex-wrap:wrap;gap:6px 14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:8px}legend{font-size:.78rem;font-weight:600;padding:0 4px}
.cpv{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);background:#e9ecf3}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}.item{grid-template-columns:56px 1fr auto}.acts{grid-column:auto}.tools{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:800px){.emb header{padding-left:58px}.emb .sheet{max-height:calc(100vh - 60px)}}label input,label select,label textarea{font-weight:400}
@media(max-width:800px){.emb header{padding-left:58px}}textarea{width:100%;padding:11px 12px;border:1px solid #b9c9ae;border-radius:10px;background:var(--card);font:inherit;font-size:1rem;resize:vertical}
.com{position:absolute;left:0;top:0;width:1611px;height:1618px;transform-origin:0 0;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.com .bg{position:absolute;left:0;top:0;width:1611px;height:1618px}.com .in{display:block;width:100%}
.com .ct,.com .cb,.com .cr,.com .cf{position:absolute;display:flex;align-items:center}
.com .ct{left:130px;width:1350px;top:493px;height:140px;justify-content:center;font:400 112px/1 'Bebas Neue',Impact,sans-serif;color:#7a1c0f;text-transform:uppercase;text-align:center}
.com .ct .in{white-space:nowrap;width:auto;display:inline-block}
.com .cb{left:175px;width:1360px;top:668px;height:320px;color:#fff;font-size:46px;line-height:1.28;text-align:center}
.com .cr{left:500px;width:860px;top:1038px;height:284px;color:#7a1c0f;font:400 66px/1.1 'Bebas Neue',Impact,sans-serif;text-transform:uppercase}
.com .cf{left:335px;width:940px;top:1538px;height:60px;color:#fff;font-size:40px;text-align:center;justify-content:center}.com .cf .in{white-space:nowrap;width:auto;display:inline-block}
.cpv{aspect-ratio:1611/1618!important}
</style></head><body><header><div class="hl"><img class="logoimg" src="icon-192.png" alt="Logo"><h1><span class="hd">Caisse Populaire </span><b>SUCCES</b></h1></div><div class="hr"></div></header><main>
  <div class="tools"><input class="s" id="q" type="search" placeholder="Rechercher un communiqué…" aria-label="Rechercher"></div>
  <div class="stats" id="rc"></div><div class="list" id="rl"></div>
  <div class="bar" style="margin-top:14px"><button class="btn alt sm" id="bk">Sauvegarder (JSON)</button><label class="btn alt sm">Restaurer<input type="file" id="rs" accept=".json" hidden></label></div>
  <p class="stats" style="margin-top:8px">Les communiqués sont enregistrés dans ce navigateur : sauvegardez régulièrement.</p>
</main>
<button class="btn fab" id="add">+ Nouveau</button>
<div class="modal" id="mform" hidden><form class="sheet" id="f" onsubmit="return false" autocomplete="off">
  <h2 id="ftitle">Nouveau communiqué</h2>
  <div class="cpv" id="pv"><div class="com" id="cert"></div></div>
  <label>Titre<input id="titre" placeholder="AVI KONJE"></label>
  <label>Message<textarea id="texte" rows="6"></textarea></label>
  <label>Bloc « rappel » (une ligne par ligne du bloc orange)<textarea id="rappel" rows="4"></textarea></label>
  <label>Pied de page<input id="pied"></label>
  <div class="bar"><button type="button" class="btn alt" data-close>Annuler</button><button type="button" class="btn" id="okb">Enregistrer</button></div>
  <div class="sec"><h3>Télécharger</h3><div class="g2"><button type="button" class="btn alt" id="bpng">Image PNG (WhatsApp)</button><button type="button" class="btn alt" id="bpdf">PDF</button></div></div>
</form></div>

const ST={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Stockage plein.')}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const strip=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const SAMPLE={titre:'AVI KONJE',texte:'Administrasyon Kès Popilè SUCCES ap anonse a tout sosyetè l yo ak Gran piblik la an jeneral ke jounen vandredi 14 Dawout la nan okazyon Jounen Bwakayiman ak Linyon pou Libète epi Samdi 15 Dawout pou Fèt Asansyon an, touletwa pwen sèvis li yo ap fèmen pòt yo pou respekte nòtprès Sekretarya Jeneral Laprezidans la. Nap relouvri Lendi 17 Dawout a pati 8è30',rappel:'SONJE SA:\nVANDREDI 14 DAWOUT KONJE\nSAMDI 15 DAWOUT KONJE\nLENDI 17 DAWOUT: 8è:30',pied:'Nòt sa pote siyati konsèy administrasyon an'};
let list=ST.get('cm_list',[]),cur=null;
const val=()=>({titre:$('titre').value.trim(),texte:$('texte').value.trim(),rappel:$('rappel').value.trim(),pied:$('pied').value.trim()});
function cH(v){return `<img class="bg" src="${BG}" alt=""><div class="ct"><span class="in">${esc(v.titre)}</span></div><div class="cb"><div class="in">${nl(v.texte)}</div></div><div class="cr"><div class="in">${nl(v.rappel)}</div></div><div class="cf"><span class="in">${esc(v.pied)}</span></div>`}
function autofit(root){
  const f=(sel,mw,mh,size,min)=>{const el=root.querySelector(sel),i=el.firstElementChild;let s=size;el.style.fontSize=s+'px';while((i.offsetHeight>mh||i.scrollWidth>mw)&&s>min){s-=2;el.style.fontSize=s+'px'}};
  f('.ct',1300,140,112,40);f('.cb',99999,318,46,22);f('.cr',99999,288,66,26);f('.cf',930,56,40,18);
}
function fit(){$('cert').style.transform='scale('+($('pv').clientWidth/1611)+')'}
function render(){$('cert').innerHTML=cH(val());autofit($('cert'));fit()}
function openF(e){
  cur=e?e.id:null;const v=e||SAMPLE;
  ['titre','texte','rappel','pied'].forEach(k=>$(k).value=v[k]);
  $('ftitle').textContent=e?'Modifier le communiqué':'Nouveau communiqué';$('mform').hidden=false;render();
}
function save(){
  const v=val();if(!v.titre||!v.texte){alert('Le titre et le message sont obligatoires.');return null}
  let e=list.find(x=>x.id===cur);if(!e){e={id:Date.now().toString(36),dt:today()};list.push(e);cur=e.id}
  Object.assign(e,v);ST.set('cm_list',list);draw();return e;
}
function draw(){
  const q=strip($('q').value),l=list.filter(e=>strip(e.titre+' '+e.texte).includes(q)).sort((a,b)=>b.dt.localeCompare(a.dt)||b.id.localeCompare(a.id));
  $('rc').textContent=l.length+' sur '+list.length+' communiqué(s)';
  $('rl').innerHTML=l.length?l.map(e=>`<div class="item"><div class="av">📢</div><div><div class="nm">${esc(e.titre)}<small>${esc(e.texte.slice(0,80))}…</small></div><div class="dt">Créé le ${e.dt.split('-').reverse().join('/')}</div></div><div class="acts"><button class="btn sm" data-o="${e.id}">Modifier</button><button class="btn alt sm" data-c="${e.id}">Dupliquer</button><button class="btn del sm" data-d="${e.id}">Supprimer</button></div></div>`).join(''):'<div class="empty">Aucun communiqué.<br>Appuyez sur « + Nouveau » : le modèle « Avi konje » est déjà prêt à modifier.</div>';
}
async function cap(){
  try{await document.fonts.ready}catch(e){}render();
  const el=$('cert').cloneNode(true);el.removeAttribute('id');el.style.cssText='transform:none;position:fixed;left:-9999px;top:0';document.body.appendChild(el);
  try{return await html2canvas(el,{scale:1,backgroundColor:null})}finally{el.remove()}
}
const fn=()=>('communique-'+(val().titre||'avi')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_');
$('bpng').onclick=async()=>{try{(await cap()).toBlob(b=>dl(b,fn()+'.png'))}catch(e){alert('Génération impossible : connexion internet requise la première fois.')}};
$('bpdf').onclick=async()=>{try{const c=await cap(),p=new jspdf.jsPDF({unit:'mm',format:[210,211]});p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,211);p.save(fn()+'.pdf')}catch(e){alert('Génération impossible : connexion internet requise la première fois.')}};
$('add').onclick=()=>openF(null);
$('okb').onclick=()=>{if(save())$('mform').hidden=true};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.modal').hidden=true});
$('f').oninput=render;$('q').oninput=draw;
$('rl').onclick=ev=>{
  const b=ev.target.closest('button');if(!b)return;const e=list.find(x=>x.id===(b.dataset.o||b.dataset.c||b.dataset.d));if(!e)return;
  if(b.dataset.o)openF(e);
  else if(b.dataset.c){list.push({...e,id:Date.now().toString(36),titre:e.titre+' (copie)',dt:today()});ST.set('cm_list',list);draw()}
  else if(confirm('Supprimer « '+e.titre+' » ?')){list=list.filter(x=>x.id!==e.id);ST.set('cm_list',list);draw()}
};
$('bk').onclick=()=>dl(new Blob([JSON.stringify({v:1,list})],{type:'application/json'}),'sauvegarde-communiques-'+today()+'.json');
$('rs').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.list))throw 0;if(!confirm('Remplacer les communiqués actuels par la sauvegarde ('+j.list.length+') ?'))return;list=j.list;ST.set('cm_list',list);draw()}catch(e){alert('Fichier invalide.')}ev.target.value=''};
new ResizeObserver(fit).observe($('pv'));
try{document.fonts.ready.then(()=>{if(!$('mform').hidden)render()})}catch(e){}
draw();
</script><script>try{document.body.classList.toggle("dark",localStorage.getItem("succes_dark")==="1")}catch(e){}</script></body></html>
